# Developing Github Actions Workflow for CI/CD

name: DevOps CICD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - ./manifests

jobs:
  devops-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Docker Login
        uses: docker/login-action@v3.5.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./Dockerfile
          tags: swayam0312/deployflow:${{ github.sha }}
          push: true

      - name: Updating image tag inside manifest files
        run: |
          pip install yq
          yq -Yi '.spec.template.spec.containers[0].image = "swayam0312/deployflow:${{ github.sha }}"' ./manifests/02_devopsdep.yaml

      - name: Commit and Push the code
        run: |
          git config user.name "swayamkr03"
          git config user.email "swayamkr03@users.noreply.github.com"
          git commit -am "Updating image tag inside manifests using Actions"
          git push origin main
