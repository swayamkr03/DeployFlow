    app: devopsdep
  name: devopsdep
  namespace: devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devopsdep
  template:
    metadata:
      labels:
        app: devopsdep
    spec:
      containers:
        - image: swayam0312/deployflow:8007509bc2835f3711902263364ef50e319a4462
          name: deployflow
