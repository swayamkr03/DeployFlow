    app: devopsdep
  name: devopsdep
  namespace: devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devopsdep
  template:
    metadata:
      labels:
        app: devopsdep
    spec:
      containers:
        - image: swayam0312/deployflow:70deacf656b2d4558494776381f5405f656674f9
          name: deployflow
